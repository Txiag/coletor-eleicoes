[project]
name = "apuracao-2026"
version = "0.1.0"
description = "Coletor de resultados consolidados do TSE em SQLite"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.142.2", "uvicorn>=0.54.0"]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
collect = "python -m apuracao.collector"
api = "python -m apuracao.api"
migrate = "python -m apuracao.migrate"
test = "python -m unittest discover -s tests -v"

[dependency-groups]
test = [
    "httpx>=0.28.1",
]
